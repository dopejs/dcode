name: dcode-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcode-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Verify Cargo workspace manifests
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py
      - name: Verify TUI dependency boundary
        run: python3 .github/scripts/verify_tui_core_boundary.py
      - name: Verify Bazel clippy flags
        run: python3 .github/scripts/verify_bazel_clippy_lints.py
      - name: Test GitHub helper scripts
        run: just test-github-scripts
      - name: Test package builder
        run: python3 -m unittest discover -s scripts/codex_package -t scripts -p 'test_*.py'
      - name: Test standalone installer
        run: python3 -m unittest discover -s scripts/install -p 'test_*.py'
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
      - name: Check formatting
        run: just fmt-check
      - name: Check JavaScript formatting
        run: pnpm run format
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  rust:
    name: Rust check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libcap-dev pkg-config
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check CLI and TUI
        working-directory: codex-rs
        run: cargo check --locked -p codex-cli -p codex-tui
      - name: Test DCode product identity
        working-directory: codex-rs
        run: just test -p codex-dcode-product
      - name: Test DeepSeek provider
        working-directory: codex-rs
        run: just test -p codex-dcode-deepseek
      - name: Test vision routing
        working-directory: codex-rs
        run: just test -p codex-core vision
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
